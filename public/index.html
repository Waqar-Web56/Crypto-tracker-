<!doctype html>
<html lang="en" class="bg-ink">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coinpulse - Live crypto prices</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{ink:'#0F1B2D',panel:'#16253B',line:'#243652',mute:'#8FA3BF',gold:'#F5B94A',up:'#2EC4A0',down:'#F0616D'},fontFamily:{sans:['Manrope','system-ui','sans-serif']}}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-ink text-slate-100 font-sans min-h-screen">
<header class="border-b border-line sticky top-0 bg-ink/90 backdrop-blur z-10">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-3">
    <span class="w-3 h-3 rounded-full bg-gold"></span>
    <span class="font-extrabold text-xl tracking-tight">Coinpulse</span>
    <span class="hidden sm:flex items-center gap-1.5 text-xs text-mute"><i class="w-2 h-2 rounded-full bg-up live"></i>Updates every 30s</span>
    <input id="q" placeholder="Search coins" aria-label="Search coins" class="ml-auto bg-panel border border-line rounded-lg px-3 py-2 text-sm w-36 sm:w-64 focus:outline-none focus:ring-2 focus:ring-gold">
    <select id="cur" aria-label="Currency" class="bg-panel border border-line rounded-lg px-2 py-2 text-sm">
      <option value="usd">USD</option><option value="eur">EUR</option><option value="gbp">GBP</option><option value="pkr">PKR</option><option value="inr">INR</option>
    </select>
  </div>
</header>
<main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
  <div id="err" class="hidden bg-down/15 border border-down/40 text-down rounded-lg px-4 py-3 text-sm"></div>
  <section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    <div class="bg-panel border border-line rounded-xl p-4"><div class="text-mute text-xs">Total market cap</div><div id="g1" class="text-xl font-extrabold mt-1">-</div></div>
    <div class="bg-panel border border-line rounded-xl p-4"><div class="text-mute text-xs">24h volume</div><div id="g2" class="text-xl font-extrabold mt-1">-</div></div>
    <div class="bg-panel border border-line rounded-xl p-4"><div class="text-mute text-xs">Bitcoin share of market</div><div id="g3" class="text-xl font-extrabold mt-1">-</div></div>
    <div class="bg-panel border border-line rounded-xl p-4"><div class="text-mute text-xs">Coins tracked</div><div id="g4" class="text-xl font-extrabold mt-1">-</div></div>
  </section>
  <section class="grid lg:grid-cols-3 gap-4">
    <div class="lg:col-span-2 bg-panel border border-line rounded-xl p-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div id="cname" class="flex items-center gap-3"></div>
        <div class="text-right"><div id="cprice" class="text-2xl font-extrabold">-</div><div id="cchg" class="text-sm"></div></div>
      </div>
      <div id="ranges" class="flex gap-1 mt-4 text-xs">
        <button data-d="1">24H</button><button data-d="7">7D</button><button data-d="30">30D</button><button data-d="90">90D</button><button data-d="365">1Y</button>
      </div>
      <div class="relative h-80 mt-3"><canvas id="chart"></canvas></div>
    </div>
    <dl id="stats" class="bg-panel border border-line rounded-xl p-4 text-sm"></dl>
  </section>
  <section class="bg-panel border border-line rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="text-mute text-xs"><tr>
          <th class="py-3 pl-4 text-left" data-sort="market_cap_rank">#</th>
          <th class="text-left">Coin</th>
          <th class="text-right" data-sort="current_price">Price</th>
          <th class="text-right hidden sm:table-cell" data-sort="price_change_percentage_1h_in_currency">1h</th>
          <th class="text-right" data-sort="price_change_percentage_24h_in_currency">24h</th>
          <th class="text-right hidden md:table-cell" data-sort="price_change_percentage_7d_in_currency">7d</th>
          <th class="text-right hidden lg:table-cell" data-sort="market_cap">Market cap</th>
          <th class="text-right hidden lg:table-cell" data-sort="total_volume">Volume (24h)</th>
          <th class="pr-4 text-left hidden md:table-cell">Last 7 days</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="9" class="p-8 text-center text-mute">Loading prices...</td></tr></tbody>
      </table>
    </div>
  </section>
  <p class="text-xs text-mute text-center pb-6">Prices are for information only and are not financial advice.</p>
</main>
<script src="js/app.js"></script>
</body>
</html>
